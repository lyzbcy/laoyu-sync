# Include in the existing HTTPS :8443 server block. Preserve other services.
location = /sync-feedback/health {
    access_log off;
    proxy_pass http://127.0.0.1:18774/health;
}
location = /sync-feedback/v1/submit {
    access_log off;
    client_max_body_size 64k;
    client_body_timeout 10s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 20s;
    proxy_pass http://127.0.0.1:18774/v1/submit;
    limit_except POST { deny all; }
}
location /sync-feedback/logs/ {
    access_log off;
    proxy_pass http://127.0.0.1:18774/logs/;
    limit_except GET { deny all; }
}
