name: Build desktop packages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'launcher-adapter.json', 'version.json']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/fetch_engine.py
      - run: python scripts/make_icon.py
      - run: python scripts/prepare_resources.py
      - name: Prepare feedback channel
        env:
          LAOYU_FEEDBACK_WEBHOOK: ${{ secrets.LAOYU_FEEDBACK_WEBHOOK }}
        run: python scripts/prepare_feedback.py
      - run: python -m PyInstaller --noconfirm LaoyuSync.spec
      - name: Verify native Windows pet lifecycle
        run: python scripts/verify_windows.py dist/LaoyuSync/LaoyuSync.exe --profile verification/ci-native
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: laoyu-sync-windows-native-evidence
          path: |
            verification/ci-native/result.json
            verification/ci-native/window.png
            verification/ci-native/data/logs/*.log
      - run: python scripts/package.py
      - name: Build installer
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/windows.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: laoyu-sync-windows
          path: |
            dist/*.zip
            dist/*setup.exe
            dist/version.json
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: |
          if [ "$(uname -m)" = "arm64" ]; then
            python scripts/fetch_engine.py --platform macos-arm64
          else
            python scripts/fetch_engine.py --platform macos-amd64
          fi
      - run: python scripts/make_icon.py
      - run: python scripts/prepare_resources.py
      - name: Prepare feedback channel
        env:
          LAOYU_FEEDBACK_WEBHOOK: ${{ secrets.LAOYU_FEEDBACK_WEBHOOK }}
        run: python scripts/prepare_feedback.py
      - run: python -m PyInstaller --noconfirm LaoyuSync.spec
      - name: Pack macOS zip (version follows core/version.py)
        run: |
          VER=$(python -c "import sys;sys.path.insert(0,'core');import version;print(version.__version__)")
          ditto -c -k --sequesterRsrc --keepParent dist/LaoyuSync.app "dist/laoyu-sync-${VER}-macos-$(uname -m).zip"
      - run: python scripts/package_mac.py
      - name: Verify native macOS archive and update rollback
        run: python scripts/verify_macos.py dist/LaoyuSync.app --profile verification/ci-mac-native
      - name: Native Mac acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laoyu-sync-macos-native-evidence
          path: verification/ci-mac-native/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: laoyu-sync-macos-unsigned
          path: |
            dist/*macos*.zip
            dist/version-macos.json
